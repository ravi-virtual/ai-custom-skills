# Keeps the repository's About description in step with skills.json, so the
# skill count is never typed by hand.
#
# Needs one repository secret, REPO_ADMIN_TOKEN: a fine-grained personal access
# token for this repository with "Administration: Read and write". The default
# GITHUB_TOKEN cannot edit repository settings. Without the secret the job
# skips and says why.
name: Sync About description

on:
  push:
    branches: [main]
    paths:
      - skills.json
      - .github/workflows/sync-about.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build description from skills.json
        id: desc
        run: |
          count=$(node -p "require('./skills.json').skills.length")
          echo "text=${count} reusable AI agent skills for MERN, Express, React and Sails.js development and debugging, plus Python, QA, video, AI workflows and freelancing, copied into a project with npx" >> "$GITHUB_OUTPUT"

      - name: Update the About description
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          DESCRIPTION: ${{ steps.desc.outputs.text }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::REPO_ADMIN_TOKEN is not set, so the About description was not updated."
            exit 0
          fi
          gh repo edit "$GITHUB_REPOSITORY" --description "$DESCRIPTION"
